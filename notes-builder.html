<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>eduCBT Notes Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <style>
    /* ============================================================
       EDUNOTES STUDIO THEME (Exact Match)
       ============================================================ */
    :root {
      --bg: #F6F8FB; --surface: #FFFFFF; --surface-2: #EEF2F8; --border: #DDE4EF;
      --text: #0F1B2D; --muted: #5A6B85; --primary: #2563EB; --primary-hover: #1D4ED8;
      --primary-soft: #E8EFFF; --success: #059669; --success-ink: #047857;
      --warning: #D97706; --danger: #DC2626; --sidebar: 260px; --header: 56px;
    }
    html[data-theme="dark"] {
      --bg: #0B1220; --surface: #111A2C; --surface-2: #17223A; --border: #22304D;
      --text: #E6ECF7; --muted: #93A3BD; --primary: #60A5FA; --primary-hover: #93C5FD;
      --primary-soft: #142A52; --success: #34D399; --warning: #FBBF24; --danger: #F87171;
    }
    
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
    button, input, textarea, select { font: inherit; color: inherit; }
    button { cursor: pointer; background: none; border: 0; }
    svg { flex-shrink: 0; vertical-align: middle; }
    .icon { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    
    /* Layout */
    .studio-shell { display: flex; flex-direction: column; height: 100dvh; background: var(--surface); }
    .studio-topbar { height: 56px; display: flex; align-items: center; padding: 0 16px; gap: 12px; border-bottom: 1px solid var(--border); background: var(--surface); z-index: 50; flex-shrink: 0; }
    .studio-main { display: flex; flex: 1; min-height: 0; }
    
    /* Sidebar */
    .studio-tree { width: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; background: var(--bg); min-height: 0; transition: transform 0.2s; }
    .studio-tree.mobile-hidden { transform: translateX(-100%); position: absolute; height: 100%; z-index: 40; }
    .tree-heading { height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid var(--border); }
    .tree-scroll { flex: 1; overflow-y: auto; padding: 12px 8px; }
    .tree-course { margin-bottom: 12px; }
    .tree-course-toggle { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px; font-size: 13px; font-weight: 600; text-align: left; border-radius: 6px; }
    .tree-course-toggle:hover { background: var(--surface-2); }
    .tree-chapter { margin: 4px 0 8px 16px; }
    .tree-lesson { display: flex; align-items: center; min-height: 36px; border-left: 2px solid transparent; border-radius: 0 6px 6px 0; padding-right: 8px; margin-left: 8px; cursor: pointer; }
    .tree-lesson:hover { background: var(--surface-2); }
    .tree-lesson.active { background: var(--primary-soft); border-left-color: var(--primary); }
    .tree-lesson-link { flex: 1; display: flex; align-items: center; gap: 6px; padding: 6px 0; font-size: 12px; line-height: 1.5; text-align: left; color: var(--text); }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); flex-shrink: 0; }
    .status-dot.draft { background: var(--warning); }
    
    /* Editor Pane */
    .editor-pane { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--surface); }
    .editor-heading { padding: 24px 24px 16px; border-bottom: 1px solid var(--border); }
    .lesson-title-input { display: block; width: 100%; border: 0; background: transparent; padding: 0; margin: 0 0 12px; font-size: 24px; font-weight: 700; letter-spacing: -0.5px; color: var(--text); outline: none; }
    .metadata-chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .meta-chip { padding: 4px 8px; display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; color: var(--muted); border: 1px solid var(--border); border-radius: 6px; background: var(--surface); }
    
    /* Toolbar */
    .editor-toolbar { display: flex; align-items: center; gap: 4px; padding: 8px 16px; border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; background: var(--surface); flex-shrink: 0; }
    .editor-toolbar button { display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 4px; color: var(--muted); }
    .editor-toolbar button:hover { background: var(--surface-2); color: var(--text); }
    .toolbar-separator { width: 1px; height: 16px; background: var(--border); margin: 0 4px; }
    
    /* Textarea */
    .editor-textarea { flex: 1; width: 100%; resize: none; border: 0; background: var(--surface); padding: 24px; font-family: 'JetBrains Mono', monospace; font-size: 14px; line-height: 1.7; color: var(--text); outline: none; overflow-y: auto; }
    
    /* Preview Pane */
    .preview-pane { flex: 1; display: flex; flex-direction: column; background: var(--bg); border-left: 1px solid var(--border); min-width: 0; }
    .preview-toolbar { height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid var(--border); background: var(--surface); }
    .preview-viewport { flex: 1; overflow-y: auto; padding: 24px; }
    
    /* Footer */
    .studio-footer { height: 48px; display: flex; align-items: center; padding: 0 16px; border-top: 1px solid var(--border); background: var(--surface); gap: 16px; font-size: 11px; color: var(--muted); flex-shrink: 0; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; font-weight: 600; background: var(--surface); color: var(--text); }
    .btn:hover { background: var(--surface-2); }
    .btn-primary { background: var(--primary); color: white; border-color: var(--primary); }
    .btn-primary:hover { background: var(--primary-hover); }
    
    /* Preview Content Typography */
    .preview-document { font-family: 'Source Serif 4', Georgia, serif; font-size: 16px; line-height: 1.8; color: var(--text); }
    .preview-document h1 { font: 700 28px/1.25 'Source Serif 4', serif; margin: 24px 0 16px; }
    .preview-document h2 { font: 600 20px/1.4 'Inter', sans-serif; letter-spacing: -0.4px; margin: 32px 0 12px; }
    .preview-document p { margin: 0 0 16px; }
    .preview-document pre { background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 16px; font: 13px/1.6 'JetBrains Mono', monospace; overflow-x: auto; }
    .preview-document code { background: var(--surface-2); color: var(--primary); padding: 2px 6px; border-radius: 4px; font: 13px 'JetBrains Mono', monospace; }
    
    /* Modals */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(8,17,33,.6); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
    .modal-backdrop.open { display: flex; }
    .modal-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; width: 100%; max-width: 500px; padding: 24px; box-shadow: 0 12px 40px rgba(0,0,0,0.2); display: flex; flex-direction: column; max-height: 90vh; }
    .modal-title { font-size: 18px; font-weight: 700; margin: 0 0 16px; }
    .field { display: block; margin-bottom: 16px; font-size: 13px; font-weight: 600; }
    .field input, .field select { display: block; width: 100%; height: 40px; margin-top: 6px; padding: 0 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; font-weight: 400; background: var(--bg); }
    
    @media (min-width: 900px) {
      #mobile-menu-btn { display: none; }
    }
    @media (max-width: 899px) {
      .studio-tree.mobile-hidden { display: none; }
      .preview-pane { display: none; }
      .preview-pane.mobile-open { display: flex; position: fixed; inset: 56px 0 48px; z-index: 60; border-left: 0; }
    }
  </style>
</head>
<body>
  <div class="studio-shell">
    <!-- TOPBAR -->
    <header class="studio-topbar">
      <button id="mobile-menu-btn" onclick="toggleMobileTree()" class="btn" style="border:none; padding:4px;">
        <svg class="icon" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      
      <a href="index.html" class="btn" style="border:none; padding:4px 8px;" title="Back to CBT">
        <svg class="icon" viewBox="0 0 24 24"><path d="M19 12H5m7-7-7 7 7 7"/></svg>
        Back
      </a>
      
      <div style="width:1px; height:16px; background:var(--border); margin:0 4px;"></div>
      
      <div style="display:flex; align-items:center; gap:8px;">
        <div style="width:28px; height:28px; border-radius:6px; background:var(--primary); display:flex; align-items:center; justify-content:center; color:white;">
          <svg class="icon" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        </div>
        <span style="font-weight:700; font-size:15px;">Notes Builder</span>
      </div>

      <div style="flex:1"></div>
      
      <div style="display:flex; gap:8px;">
        <button onclick="toggleMobilePreview()" class="btn">
          <svg class="icon" viewBox="0 0 24 24" style="width:16px; height:16px;"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          Preview
        </button>
        <button onclick="openImportModal()" class="btn">Import</button>
        <button onclick="openExportModal()" class="btn">Export</button>
        <button onclick="openPublishModal()" class="btn btn-primary">Publish</button>
      </div>
    </header>

    <main class="studio-main">
      <!-- SIDEBAR -->
      <aside id="left-panel" class="studio-tree">
        <div class="tree-heading">
          <span style="font-size:11px; font-weight:600; color:var(--muted); letter-spacing:0.5px;">COURSE OUTLINE</span>
          <button onclick="addSubject()" class="btn" style="height:24px; width:24px; padding:0;">
            <svg class="icon" viewBox="0 0 24 24" style="width:14px; height:14px;"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
        <div id="tree-scroll" class="tree-scroll"></div>
        <div style="padding:12px; border-top:1px solid var(--border); background:var(--surface);">
          <button onclick="openImportModal()" class="btn" style="width:100%;">
            <svg class="icon" viewBox="0 0 24 24" style="width:16px; height:16px;"><path d="M12 16V3m-5 5 5-5 5 5M4 17v4h16v-4"/></svg>
            Import a markdown lesson
          </button>
        </div>
      </aside>

      <!-- EDITOR -->
      <section class="editor-pane">
        <div class="editor-heading">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
            <span style="font-size:10px; font-weight:600; color:var(--muted); letter-spacing:1px;">YOUR NEXT GREAT LESSON</span>
            <button onclick="openExportModal()" class="btn" style="border:none; padding:4px;">
              <svg class="icon" viewBox="0 0 24 24"><path d="M12 3v13m-5-5 5 5 5-5M4 17v4h16v-4"/></svg>
            </button>
          </div>
          <input id="lesson-title-input" class="lesson-title-input" type="text" placeholder="Give your lesson a title">
          <div class="metadata-chips">
            <button class="meta-chip" onclick="selectSubject()">
              <svg class="icon" viewBox="0 0 24 24" style="width:12px; height:12px;"><path d="M12 5.5C8.5 3.4 5 3.4 2.5 4.5v14C5 17.4 8.5 17.4 12 19.5c3.5-2.1 7-2.1 9.5-1v-14C19 3.4 15.5 3.4 12 5.5Z"/></svg>
              <span id="chip-subject">Subject</span>
            </button>
            <button class="meta-chip">Grade 8</button>
            <button class="meta-chip">Easy</button>
            <button class="meta-chip">5 min</button>
            <button class="meta-chip">+ Tags</button>
          </div>
        </div>

        <div class="editor-toolbar">
          <button data-format="bold" title="Bold"><strong>B</strong></button>
          <button data-format="italic" title="Italic"><em>I</em></button>
          <div class="toolbar-separator"></div>
          <button data-format="h1" title="Heading 1">H1</button>
          <button data-format="h2" title="Heading 2">H2</button>
          <div class="toolbar-separator"></div>
          <button data-format="link" title="Link">
            <svg class="icon" viewBox="0 0 24 24"><path d="m9 15 6-6M9 7l3-3a5 5 0 0 1 7 7l-3 3M15 17l-3 3a5 5 0 0 1-7-7l3-3"/></svg>
          </button>
          <button data-format="list" title="List">
            <svg class="icon" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>
          </button>
          <button data-format="tasks" title="Tasks">
            <svg class="icon" viewBox="0 0 24 24"><path d="m3 6 2 2 3-4m-5 9 2 2 3-4m-5 9 2 2 3-4M11 6h10M11 13h10M11 20h10"/></svg>
          </button>
          <button data-format="code" title="Code">
            <svg class="icon" viewBox="0 0 24 24"><path d="m8 6-6 6 6 6m8-12 6 6-6 6m-3-15-2 18"/></svg>
          </button>
          <div class="toolbar-separator"></div>
          <button data-format="math" title="Math">
            <svg class="icon" viewBox="0 0 24 24"><path d="M19 4H5l8 8-8 8h14"/></svg>
          </button>
          <button data-format="quiz" title="Quiz">
            <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.2 8.5a3 3 0 0 1 5.7 1.2c0 2-3 2-3 4m0 3h.01"/></svg>
          </button>
          <button data-format="callout" title="Callout">
            <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10h.01"/></svg>
          </button>
        </div>

        <textarea id="lesson-body" class="editor-textarea" spellcheck="false" placeholder="A new idea starts here..."></textarea>
      </section>

      <!-- PREVIEW -->
      <aside id="right-panel" class="preview-pane">
        <div class="preview-toolbar">
          <span style="font-size:10px; font-weight:600; color:var(--muted); letter-spacing:1px; display:flex; align-items:center; gap:6px;">
            <span class="status-dot"></span> LIVE PREVIEW
          </span>
        </div>
        <div class="preview-viewport">
          <div id="preview-content" class="preview-document"></div>
        </div>
      </aside>
    </main>

    <footer class="studio-footer">
      <span id="word-count">0 words · 0 blocks</span>
      <span style="flex:1;"></span>
      <span style="display:flex; align-items:center; gap:6px; color:var(--success);">
        <svg class="icon" viewBox="0 0 24 24" style="width:14px; height:14px;"><path d="m5 12 4 4L19 6"/></svg>
        <span id="save-status">Saved</span>
      </span>
    </footer>
  </div>

  <!-- MODAL: Import -->
  <div id="modal-import" class="modal-backdrop">
    <div class="modal-card">
      <h2 class="modal-title">Import Notes</h2>
      <div style="display:flex; gap:8px; margin-bottom:16px; border-bottom:1px solid var(--border); padding-bottom:8px;">
        <button class="import-tab active" data-tab="file" style="font-size:13px; font-weight:600; color:var(--primary); border-bottom:2px solid var(--primary); padding-bottom:6px;">From file</button>
        <button class="import-tab" data-tab="github" style="font-size:13px; font-weight:600; color:var(--muted); padding-bottom:6px;">From GitHub</button>
        <button class="import-tab" data-tab="paste" style="font-size:13px; font-weight:600; color:var(--muted); padding-bottom:6px;">Paste</button>
      </div>
      
      <div class="import-panel" data-panel="file">
        <div onclick="document.getElementById('import-file-input').click()" style="border:2px dashed var(--border); padding:32px; text-align:center; border-radius:8px; cursor:pointer;">
          <p style="font-weight:600; font-size:14px; margin:0 0 4px;">Drop a file here</p>
          <p style="font-size:12px; color:var(--muted); margin:0;">Accepts .js and .md files</p>
          <input type="file" id="import-file-input" accept=".js,.md,.txt" style="display:none;" onchange="handleImportFile(event)">
        </div>
      </div>
      
      <div class="import-panel" data-panel="github" style="display:none;">
        <label class="field">Owner <input id="import-gh-owner" type="text"></label>
        <label class="field">Repository <input id="import-gh-repo" type="text"></label>
        <label class="field">Filename <input id="import-gh-filename" type="text" placeholder="physics-notes.js"></label>
        <button onclick="fetchFromGitHub()" class="btn btn-primary" style="width:100%;">Fetch</button>
      </div>
      
      <div class="import-panel" data-panel="paste" style="display:none;">
        <textarea id="import-paste" style="width:100%; height:120px; padding:12px; border:1px solid var(--border); border-radius:6px; font-family:monospace; font-size:12px; margin-bottom:12px;" placeholder="Paste raw note text here..."></textarea>
        <button onclick="parsePasted()" class="btn btn-primary" style="width:100%;">Parse</button>
      </div>

      <div id="import-summary" style="margin-top:16px; padding:12px; background:var(--bg); border-radius:6px; font-size:12px; display:none;"></div>

      <div style="margin-top:16px;">
        <label style="font-size:13px; font-weight:600; margin-right:12px;">Mode:</label>
        <label style="font-size:13px; margin-right:8px;"><input type="radio" name="import-mode" value="replace" checked> Replace</label>
        <label style="font-size:13px; margin-right:8px;"><input type="radio" name="import-mode" value="merge"> Merge</label>
        <label style="font-size:13px;"><input type="radio" name="import-mode" value="append"> Append</label>
      </div>

      <div style="display:flex; justify-content:flex-end; gap:12px; margin-top:24px;">
        <button onclick="closeModal('modal-import')" class="btn">Cancel</button>
        <button id="import-confirm" onclick="executeImport()" class="btn btn-primary" disabled>Import</button>
      </div>
    </div>
  </div>

  <!-- MODAL: Publish -->
  <div id="modal-publish" class="modal-backdrop">
    <div class="modal-card">
      <h2 class="modal-title">Publish to GitHub</h2>
      <label class="field">GitHub Username <input id="gh-owner" type="text"></label>
      <label class="field">Repository <input id="gh-repo" type="text"></label>
      <label class="field">Filename <input id="publish-filename" type="text"></label>
      
      <div id="publish-preflight" style="font-size:12px; margin-bottom:16px; color:var(--success);"></div>
      
      <div id="publish-script-tag" style="display:none; background:var(--bg); padding:12px; border-radius:6px; font-family:monospace; font-size:11px; margin-bottom:16px; word-break:break-all;">
        <div style="font-family:sans-serif; font-weight:600; margin-bottom:4px; display:flex; justify-content:space-between;">
          <span>Add to notes.html:</span>
          <button onclick="copyScriptTag()" class="btn" style="height:20px; font-size:10px;">Copy</button>
        </div>
        <span id="script-tag-text"></span>
      </div>

      <div style="display:flex; justify-content:flex-end; gap:12px;">
        <button onclick="closeModal('modal-publish')" class="btn">Cancel</button>
        <button id="publish-btn" onclick="executePublish()" class="btn btn-primary">Publish</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast-host" style="position:fixed; bottom:60px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; gap:8px; align-items:center; z-index:200; pointer-events:none;"></div>

  <script defer src="js/notes-builder.js"></script>
</body>
</html>
