<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>eduCBT Notes Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;650;700;750;800&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  
  <!-- Load the exact CSS from your EduNotes app -->
  <link rel="stylesheet" href="css/edunotes.css">

  <script defer src="js/notes-builder.js"></script>
</head>
<body>
  <div id="app"></div>
  <div id="overlay-root"></div>
  <div class="toast-host" id="toast-host" role="status" aria-live="polite"></div>
  <input type="file" id="import-file" accept=".md,.markdown,text/markdown,text/plain" hidden>

  <!-- PUBLISH MODAL -->
  <div id="modal-publish" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm hidden items-center justify-center p-4">
    <div class="bg-surface border border-border rounded-xl w-full max-w-md p-6 shadow-2xl flex flex-col max-h-[90vh]">
      <div class="flex items-center justify-between pb-4 border-b border-border shrink-0">
        <h3 class="text-lg font-bold text-text">Publish to GitHub</h3>
        <button onclick="closeModal('modal-publish')" class="text-muted hover:text-text text-xl">✕</button>
      </div>
      <div class="flex-1 overflow-y-auto py-4 space-y-4">
        <label class="block text-sm font-medium text-text">GitHub Username
          <input id="gh-owner" type="text" class="w-full bg-surface text-text border border-border rounded-lg px-3 py-2 mt-1 focus:outline-none focus:border-primary">
        </label>
        <label class="block text-sm font-medium text-text">Repository
          <input id="gh-repo" type="text" class="w-full bg-surface text-text border border-border rounded-lg px-3 py-2 mt-1 focus:outline-none focus:border-primary">
        </label>
        <label class="block text-sm font-medium text-text">File name
          <input id="publish-filename" type="text" class="w-full bg-surface text-text border border-border rounded-lg px-3 py-2 mt-1 focus:outline-none focus:border-primary font-mono text-sm">
        </label>
        <div id="publish-script-tag" class="bg-primary-soft border border-primary/30 rounded-xl p-4 text-xs font-mono text-primary hidden">
          <div class="flex items-center justify-between mb-2">
            <span class="font-sans font-bold text-sm">Add to notes.html:</span>
            <button onclick="copyText(document.getElementById('script-tag-text').textContent)" class="px-2 py-1 bg-primary text-white rounded text-[10px]">Copy</button>
          </div>
          <code id="script-tag-text" class="block break-all text-text"></code>
        </div>
      </div>
      <div class="flex justify-end gap-2 pt-4 border-t border-border shrink-0">
        <button onclick="closeModal('modal-publish')" class="px-4 py-2 border border-border rounded-lg text-sm hover:bg-surface2">Cancel</button>
        <button id="publish-btn" class="px-4 py-2 bg-primary text-white rounded-lg text-sm font-semibold hover:bg-primary-hover">Publish</button>
      </div>
    </div>
  </div>

  <!-- EXPORT MODAL -->
  <div id="modal-export" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm hidden items-center justify-center p-4">
    <div class="bg-surface border border-border rounded-xl w-full max-w-2xl p-6 shadow-2xl flex flex-col max-h-[90vh]">
      <div class="flex items-center justify-between pb-4 border-b border-border shrink-0">
        <h3 class="text-lg font-bold text-text">Export Code</h3>
        <button onclick="closeModal('modal-export')" class="text-muted hover:text-text text-xl">✕</button>
      </div>
      <div class="flex-1 flex flex-col min-h-0 py-4">
        <pre id="export-preview" class="flex-1 p-4 bg-bg border border-border rounded-xl font-mono text-xs text-text overflow-auto whitespace-pre-wrap select-all"></pre>
      </div>
      <div class="flex justify-end gap-2 pt-4 border-t border-border shrink-0">
        <button onclick="closeModal('modal-export')" class="px-4 py-2 border border-border rounded-lg text-sm hover:bg-surface2">Cancel</button>
        <button id="export-copy" class="px-4 py-2 border border-border rounded-lg text-sm hover:bg-surface2 font-semibold">Copy Code</button>
        <button id="export-download" class="px-4 py-2 bg-primary text-white rounded-lg text-sm font-semibold hover:bg-primary-hover">Download .js</button>
      </div>
    </div>
  </div>
</body>
</html>
